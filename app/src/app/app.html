<header>
  <h1>Kontrola tiketu</h1>
  <p class="upozorneni">
    Vyhodnocení je neoficiální a nezávazné. Závazná je vždy kontrola na terminálu Allwyn.
  </p>
</header>

<nav>
  <a routerLink="/" routerLinkActive="aktivni" [routerLinkActiveOptions]="{ exact: true }">Tikety</a>
  <a routerLink="/tiket/novy" routerLinkActive="aktivni">Nový tiket</a>
  <a routerLink="/import" routerLinkActive="aktivni">Výsledky</a>
</nav>

<main>
  <router-outlet />
</main>

<footer>
  @if (stav.vysledkyDo(); as datum) {
    <span>Výsledky mám do {{ datum }}.</span>
  } @else {
    <span>Zatím nemáš naimportované žádné výsledky.</span>
  }
</footer>
