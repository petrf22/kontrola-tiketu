apply plugin: 'com.android.application'

// --- Podepisování release buildu (docs/vydani.md, "Podpisový klíč") -------------------------
// Hesla se berou z Gradle properties (~/.gradle/gradle.properties, nebo -P na příkazové řádce),
// nikdy natvrdo z repozitáře. Když kterákoli hodnota chybí, signingConfig se vůbec nezaloží
// a release build spadne zpátky na ladicí klíč, místo aby selhal — sestavit release APK s R8
// a ověřit ho musí jít i na stroji, kde klíč není. Tvrdá varianta, která bez klíče selže, jsou
// tasky publishableBundle/publishableApk níž; ty se pouštějí, když artefakt jde ven.
def releaseStoreFile = findProperty('KONTROLA_TIKETU_STORE_FILE')
def releaseStorePassword = findProperty('KONTROLA_TIKETU_STORE_PASSWORD')
def releaseKeyAlias = findProperty('KONTROLA_TIKETU_KEY_ALIAS')
def releaseKeyPassword = findProperty('KONTROLA_TIKETU_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// Staví se AAB? Rozhoduje se z názvů požadovaných tasků, protože rozdělení APK podle ABI
// se s bundlem nesnese (viz komentář u splits níž). Nedá se to poznat jinak než takhle —
// v době konfigurace ještě žádný task neběží.
def staviSeBundle = gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }
def staviSeApk = gradle.startParameter.taskNames.any {
    def t = it.toLowerCase()
    t.contains('assemble') || t.contains('publishableapk')
}

android {
    namespace = "cz.petrf22.kontrolatiketu"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cz.petrf22.kontrolatiketu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Generováno tools/verze/sync.mjs z kořenového VERSION — needituj ručně.
        versionCode 101
        versionName "0.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    // Nativní knihovny (SQLCipher, ML Kit) tvoří většinu velikosti a každá architektura
    // je v balíku zvlášť. Rozdělením vznikne APK pro každou zvlášť, takže se do telefonu
    // dostane jen ta jeho. Play Bundle dělá totéž; tohle je jeho obdoba pro sideload.
    //
    // Rozdělení se ale NESMÍ potkat s bundleRelease: se zapnutým shrinkResources vyrobí R8
    // zkrácené zdroje zvlášť pro každou architekturu a sestavení AAB pak spadne na
    // "Multiple shrunk-resources files found" (AGP 8.13, issuetracker 402800800). AAB si
    // splity dělá sám, takže se pro něj rozdělení vypne. Důsledek: APK a AAB se musí stavět
    // dvěma oddělenými spuštěními Gradlu — viz kontrola pod blokem android.
    splits {
        abi {
            enable !staviSeBundle
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true   // ať zůstane i verze pro všechny, kdyby byla potřeba
        }
    }

    buildTypes {
        release {
            // R8 zapnutý schválně. Debug build maskuje, že si Capacitor, SQLCipher i ML Kit
            // hledají třídy za běhu reflexí — bez ověření release buildu by se to zjistilo
            // až u uživatele.
            minifyEnabled true
            shrinkResources true
            // Vlastní klíč, když je k dispozici, jinak ladicí — na ověření R8 stačí.
            // Zpátky na ladicí klíč se smí spadnout jen tady; publishableBundle to nedovolí.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            // Záměrně tu NENÍ `ndk { debugSymbolLevel }`, které má předloha. Nahrání
            // ladicích symbolů zapíná v Play Console čitelné nativní pády, a to je přesně
            // ten druh dat o uživateli, který zadání zakazuje ("žádné analytics, crash
            // reporting ani telemetrie, ani v dev buildu"). Viz docs/vydani.md.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Obojí najednou nejde: rozdělení podle ABI je buď zapnuté (APK), nebo vypnuté (AAB), a mění
// se v době konfigurace. Bez téhle kontroly by APK tiše vyšlo jen univerzální — 75 MB místo 26.
if (staviSeBundle && staviSeApk) {
    throw new GradleException(
        'AAB a rozdělená APK nejdou sestavit jedním spuštěním Gradlu — rozdělení podle ABI se ' +
        'musí pro bundle vypnout. Spusť je zvlášť:\n' +
        '  ./gradlew :app:publishableBundle\n' +
        '  ./gradlew :app:publishableApk\n' +
        'Viz docs/vydani.md, "Past: AAB a rozdělená APK se nesnesou".')
}

// --- Publikace: podepsaný a OVĚŘENÝ artefakt (docs/vydani.md, "Podpisový klíč") -------------
// Na rozdíl od bundleRelease/assembleRelease, které musí projít i bez klíče (viz komentář
// u hasReleaseSigning nahoře), publishableBundle/publishableApk bez klíče SELŽOU — a to dřív,
// než se spustí zdlouhavý R8 build, ne až po něm.

/** Spustí externí nástroj a vrátí návratový kód spolu s celým výpisem. */
def spustNastroj(List<String> prikaz) {
    def proces = new ProcessBuilder(prikaz).redirectErrorStream(true).start()
    def vypis = proces.inputStream.getText('UTF-8')
    proces.waitFor()
    return [kod: proces.exitValue(), vypis: vypis]
}

/** Kořen Android SDK: nejdřív sdk.dir z local.properties, pak proměnné prostředí. */
def androidSdkDir() {
    def vlastnosti = new Properties()
    def local = rootProject.file('local.properties')
    if (local.exists()) {
        local.withInputStream { vlastnosti.load(it) }
    }
    def adresar = vlastnosti.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (!adresar) {
        throw new GradleException(
            'Nenašel jsem Android SDK — chybí sdk.dir v app/android/local.properties i ANDROID_HOME.')
    }
    return new File(adresar)
}

/** apksigner z nejnovějších nainstalovaných build-tools. */
def apksignerPath() {
    def buildTools = new File(androidSdkDir(), 'build-tools')
    def nejnovejsi = buildTools.listFiles()?.findAll { it.directory }?.sort { it.name }?.reverse()
    def nalezeny = nejnovejsi?.collect { new File(it, 'apksigner') }?.find { it.isFile() }
    if (!nalezeny) {
        throw new GradleException("apksigner nenalezen v ${buildTools} — doinstaluj build-tools.")
    }
    return nalezeny
}

/** jarsigner z JDK, kterým běží Gradle. */
def jarsignerPath() {
    def java = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
    def nalezeny = new File(java, 'bin/jarsigner')
    if (!nalezeny.isFile()) {
        throw new GradleException("jarsigner nenalezen v ${nalezeny} — zkontroluj JAVA_HOME.")
    }
    return nalezeny
}

tasks.register('checkReleaseSigning') {
    group = 'publishing'
    description = 'Ověří, že jsou k dispozici všechny KONTROLA_TIKETU_* podpisové property a keystore existuje.'
    def chybejici = [
        'KONTROLA_TIKETU_STORE_FILE': releaseStoreFile,
        'KONTROLA_TIKETU_STORE_PASSWORD': releaseStorePassword,
        'KONTROLA_TIKETU_KEY_ALIAS': releaseKeyAlias,
        'KONTROLA_TIKETU_KEY_PASSWORD': releaseKeyPassword,
    ].findAll { !it.value }.keySet()
    def keystore = releaseStoreFile ? file(releaseStoreFile) : null
    doLast {
        if (!chybejici.isEmpty()) {
            throw new GradleException(
                "Chybí podpisové property: ${chybejici.join(', ')} — viz docs/vydani.md, \"Podpisový klíč\".")
        }
        if (!keystore.isFile()) {
            throw new GradleException("KONTROLA_TIKETU_STORE_FILE ('${keystore}') neukazuje na existující soubor.")
        }
        logger.lifecycle("Podpisový klíč k dispozici: ${keystore}")
    }
    // Vždycky znovu vyhodnotit — je to levná kontrola a "up-to-date" by tu skrylo zaniklý klíč.
    outputs.upToDateWhen { false }
}

tasks.register('verifyBundleSignature') {
    group = 'publishing'
    description = 'Ověří podpis sestaveného AAB.'
    dependsOn 'bundleRelease'
    doLast {
        def aab = layout.buildDirectory.file('outputs/bundle/release/app-release.aab').get().asFile
        if (!aab.isFile()) {
            throw new GradleException("Nenašel jsem ${aab} — bundleRelease nic nevyrobil?")
        }
        // Bez -strict: klíč je self-signed, přísný režim by hlásil chainNotValidated.
        def vysledek = spustNastroj([jarsignerPath().toString(), '-verify', '-verbose:summary', '-certs', aab.toString()])
        if (vysledek.kod != 0 || !vysledek.vypis.contains('jar verified')) {
            throw new GradleException("${aab.name} není platně podepsaný:\n${vysledek.vypis}")
        }
        logger.lifecycle("Podpis ověřen: ${aab.name} (${(aab.length() / 1024 / 1024).round(1)} MB)")
    }
}

tasks.register('verifyApkSignature') {
    group = 'publishing'
    description = 'Ověří podpis všech sestavených release APK.'
    dependsOn 'assembleRelease'
    doLast {
        def adresar = layout.buildDirectory.dir('outputs/apk/release').get().asFile
        def apky = adresar.listFiles()?.findAll { it.name.endsWith('.apk') }?.sort { it.name }
        if (!apky) {
            throw new GradleException("V ${adresar} není žádné APK — assembleRelease nic nevyrobil?")
        }
        def apksigner = apksignerPath().toString()
        apky.each { apk ->
            def vysledek = spustNastroj([apksigner, 'verify', '--print-certs', apk.toString()])
            if (vysledek.kod != 0) {
                throw new GradleException("${apk.name} není platně podepsané:\n${vysledek.vypis}")
            }
            logger.lifecycle("Podpis ověřen: ${apk.name} (${(apk.length() / 1024 / 1024).round(1)} MB)")
        }
    }
}

tasks.register('publishableBundle') {
    group = 'publishing'
    description = 'Podepsaný a ověřený AAB pro Google Play — na rozdíl od bundleRelease bez klíče selže.'
    dependsOn 'checkReleaseSigning', 'bundleRelease', 'verifyBundleSignature'
}

tasks.register('publishableApk') {
    group = 'publishing'
    description = 'Podepsaná a ověřená APK pro sideload — na rozdíl od assembleRelease bez klíče selžou.'
    dependsOn 'checkReleaseSigning', 'assembleRelease', 'verifyApkSignature'
}

// Kontrola klíče musí doběhnout PŘED zdlouhavým R8 buildem, ne až po něm.
afterEvaluate {
    tasks.named('bundleRelease') { mustRunAfter 'checkReleaseSigning' }
    tasks.named('assembleRelease') { mustRunAfter 'checkReleaseSigning' }
}
